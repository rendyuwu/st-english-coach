<div style="display: flex; flex-direction: column; gap: 8px">
    <label for="wtracker-chat-schema-select">Select the feedback schema preset for this chat:</label>
    <select id="wtracker-chat-schema-select" class="text_pole">
        {{#each presets}} {{#if this.selected}}
        <option value="{{this.key}}" selected>{{this.name}}</option>
        {{else}}
        <option value="{{this.key}}">{{this.name}}</option>
        {{/if}} {{/each}}
    </select>
</div>
